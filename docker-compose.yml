services:
  postgres:
    image: postgres:16-alpine
    container_name: chess-postgres
    command: ["-p", "${DB_INTERNAL_PORT}"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - chess_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - chess-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p ${DB_INTERNAL_PORT} -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      timeout: 30s
      retries: 10
      start_period: 40s
      interval: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M

  redis:
    image: redis:7-alpine
    container_name: chess-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --port ${REDIS_PORT}
    volumes:
      - chess_redis_data:/data
    networks:
      - chess-internal
 
  backend-prod:
    profiles:
      - prod
    build:
      context: ./backend
      target: runner
    platform: linux/amd64
    image: maksimmaltsev/hamster-chess-backend:latest
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    env_file:
      - .env.secret
    environment:
      PORT: ${BACKEND_PORT}
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: ${DB_INTERNAL_PORT}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      chess-network:
        aliases:
          - backend
      chess-internal:
    volumes:
      - chess_backend_uploads:/app/uploads
  
  backend-dev:
    profiles:
      - dev
    build:
      context: ./backend
      target: development
    platform: linux/amd64
    image: maksimmaltsev/hamster-chess-backend:latest
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    env_file:
      - .env.secret
    environment:
      PORT: ${BACKEND_PORT}
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: ${DB_INTERNAL_PORT}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      chess-network:
        aliases:
          - backend
      chess-internal:
    volumes:
      - chess_backend_uploads:/app/uploads
      - ./backend/src:/app/src

  frontend-prod:
    profiles:
      - prod
    build:
      context: ./frontend
      target: runner
      args:
        API_URL: ${API_URL}
        SOCKET_URL: ${SOCKET_URL}
    platform: linux/amd64
    image: maksimmaltsev/hamster-chess-frontend:latest
    ports:
      - "${FRONTEND_PORT}:80"
    environment:
      API_URL: ${API_URL}
      SOCKET_URL: ${SOCKET_URL}
    networks:
      - chess-network
    restart: unless-stopped

  frontend-dev:
    profiles:
      - dev
    build:
      context: ./frontend
      target: development
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL}
    platform: linux/amd64
    image: maksimmaltsev/hamster-chess-frontend:latest
    ports:
      - "${FRONTEND_PORT}:5173"
    environment:
      # consumed by vite.config.ts as the dev proxy targets (/app-api, /app-socket -> backend)
      API_URL: ${API_URL}
      SOCKET_URL: ${SOCKET_URL}
      VITE_API_URL: ${VITE_API_URL}
      VITE_SOCKET_URL: ${VITE_SOCKET_URL}
    networks:
      - chess-network
    volumes:
      - ./frontend:/app
      # anonymous volume keeps the image's node_modules instead of the host's
      - /app/node_modules
    restart: unless-stopped

volumes:
  chess_postgres_data:
  chess_redis_data:
  chess_backend_uploads:

networks:
  # public-facing network (services with published ports live here)
  chess-network:
    driver: bridge
  # isolated network for data services (no internet, no published ports)
  chess-internal:
    driver: bridge
    internal: true